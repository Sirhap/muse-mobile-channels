name: Channel sandbox regression
on:
  push:
  pull_request:
jobs:
  sandbox:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/checkout@v4
        with:
          repository: wong2/muse-client
          ref: 1043c1687234593d1308245c62afcfe23be37b91
          path: reference/muse-client
      - run: python -m pip install -e '.[dev]'
      - run: python tests/run_core_regression.py
        env:
          TMPDIR: /tmp
          PYTHONDONTWRITEBYTECODE: '1'
      - run: bash tests/test_hook_heal_20261011.sh
