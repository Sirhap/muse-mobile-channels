# Cloudflare tunnel plugin configuration — EXAMPLE.
# Copy to plugin.conf and fill in your own values:
#   cp plugin.example.conf plugin.conf
# plugin.conf is machine-local and is NOT tracked in git.

TUNNEL_NAME=your-tunnel
HOSTNAME=your.domain.example
LOCAL_PORT=8899
SITE_DIR=/path/to/your/site-dir
ENABLE_PINGGY=1
