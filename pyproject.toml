[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-mobile-channels"
dynamic = ["version"]
description = "Local task core and WeChat/WeCom adapters for Muse"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
weixin = ["httpx==0.28.1", "cryptography==46.0.3", "qrcode==8.2", "pillow==11.3.0"]
wecom = ["httpx==0.28.1", "websockets==17.1", "cryptography==46.0.3"]
dev = ["httpx==0.28.1", "websockets==17.1", "cryptography==46.0.3", "qrcode==8.2", "pillow==11.3.0"]

[project.scripts]
muse-channels = "mobile_channels.__main__:main"

[tool.setuptools.packages.find]
include = ["mobile_channels*"]

# The version lives in the VERSION file at the repo root (date-based
# YYYY.MM.DD.N, set by `python3 ops/bump_version.py` before a release).
# setuptools reads it here so the packaged version always matches.
[tool.setuptools.dynamic]
version = {file = "VERSION"}
